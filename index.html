<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Upper/Lower Log</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="U/L Log">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050505; --surface:#0C0C0D; --ink:#E6E6E6; --muted:#8A8A8A; --line:#2A2A2D; --field:#070707;
  --red:#C4121F; --red-hi:#E3202F; --bone:#D6D6D6;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.bf{font-family:"UnifrakturMaguntia","Old English Text MT",serif;font-weight:400}

/* background filigree */
.bgdeco{position:fixed;inset:0;pointer-events:none;z-index:0}
.bgdeco .corner{position:absolute;width:min(30vw,170px);height:auto;color:var(--bone);opacity:.28}
.bgdeco .tl{top:env(safe-area-inset-top,0px);left:0}
.bgdeco .tr{top:env(safe-area-inset-top,0px);right:0;transform:scaleX(-1)}
.bgdeco .bl{bottom:env(safe-area-inset-bottom,0px);left:0;transform:scaleY(-1)}
.bgdeco .br{bottom:env(safe-area-inset-bottom,0px);right:0;transform:scale(-1,-1)}
.bgdeco .script{position:absolute;top:calc(env(safe-area-inset-top,0px) + 70px);left:50%;transform:translateX(-50%);width:min(78vw,420px);opacity:.1;color:#CFCFCF}

.wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:14px 16px 150px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0 18px}
h1{font-family:"UnifrakturMaguntia","Old English Text MT",serif;font-weight:400;font-size:2.1rem;line-height:1;margin:0;text-shadow:0 0 14px rgba(196,18,31,.45)}
.tabs{display:flex;gap:2px}
.tabs button{border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--muted);font:600 1rem "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.12em;padding:6px 10px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom:2px solid var(--red)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--red-hi);outline-offset:2px}

/* day seals */
.plates{display:flex;gap:10px;overflow-x:auto;padding:8px 4px 14px;margin:0 -4px}
.plate{flex:0 0 auto;width:54px;height:54px;border-radius:50%;cursor:pointer;position:relative;display:grid;place-items:center;
  background:var(--field);color:var(--ink);border:1.5px solid var(--c);box-shadow:inset 0 0 0 4px var(--bg), inset 0 0 0 5px var(--line)}
.plate b{font:700 1.05rem/1 "Barlow Condensed",sans-serif;letter-spacing:.05em}
.plate[aria-pressed="true"]{background:var(--c);color:var(--pc);box-shadow:0 0 18px var(--glow), inset 0 0 0 4px rgba(0,0,0,.35)}
.plate .next{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%) rotate(45deg);width:6px;height:6px;background:var(--red)}
.plate.rest{border-style:dashed}

.dayhead{margin:14px 0 24px;text-align:center}
.dayhead h2{font-family:"UnifrakturMaguntia","Old English Text MT",serif;font-weight:400;font-size:3.4rem;line-height:1;margin:0;text-shadow:0 0 20px var(--glow)}
.orn{display:block;width:min(260px,72%);height:14px;margin:10px auto 0;color:var(--c)}
.dayhead p{margin:8px 0 0;color:var(--muted);font:600 .95rem "Barlow Condensed",sans-serif;letter-spacing:.22em}

.ex{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:16px 16px 14px;margin:0 4px 16px}
.ex::before,.ex::after{content:"";position:absolute;width:14px;height:14px;border:1.5px solid var(--bone);pointer-events:none}
.ex::before{top:-5px;left:-5px;border-right:0;border-bottom:0}
.ex::after{bottom:-5px;right:-5px;border-left:0;border-top:0}
.ex h3{font:700 1.35rem/1.15 "Barlow Condensed",sans-serif;letter-spacing:.03em;margin:0;display:flex;align-items:center;gap:9px}
.ex h3::before{content:"";width:7px;height:7px;background:var(--red);transform:rotate(45deg);flex:0 0 auto;box-shadow:0 0 8px rgba(196,18,31,.8)}
.meta{color:var(--muted);font-size:.92rem;margin:3px 0 10px}
.hint{color:var(--red-hi);font-weight:600;font-size:.9rem;margin:-6px 0 10px;text-shadow:0 0 10px rgba(196,18,31,.5)}
.setrow{display:grid;grid-template-columns:48px 1fr 1fr;gap:8px;align-items:center;margin-top:6px}
.setrow span{color:var(--muted);font:600 .95rem "Barlow Condensed",sans-serif;letter-spacing:.06em}
.field{position:relative}
.field input{width:100%;font:600 1.1rem "Barlow",sans-serif;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:2px;padding:9px 40px 9px 12px;min-height:44px;transition:border-color .15s}
.field input:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 1px var(--red),0 0 12px rgba(196,18,31,.35)}
.field input::placeholder{color:var(--muted);opacity:.55}
.field em{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);font-size:.85rem;pointer-events:none}

.restbox{background:var(--surface);border:1px dashed var(--line);border-radius:2px;padding:26px;text-align:center;color:var(--muted)}

.savebar{position:fixed;z-index:5;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 65%,transparent)}
.savebar .inner{max-width:640px;margin:0 auto}
.primary{width:100%;border:1px solid var(--red-hi);border-radius:2px;background:var(--red);color:#fff;font-family:"UnifrakturMaguntia","Old English Text MT",serif;font-size:1.6rem;line-height:1;padding:13px;cursor:pointer;min-height:54px;box-shadow:0 0 22px rgba(196,18,31,.45)}
.primary:active{background:#9E0E19}
.ghost{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:2px;padding:6px 12px;font:600 .9rem "Barlow",sans-serif;cursor:pointer}
.ghost:hover{color:var(--red-hi);border-color:var(--red)}

/* history */
.hist details{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:2px;margin:0 4px 12px}
.hist summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.hist summary::-webkit-details-marker{display:none}
.hist summary strong{font-family:"UnifrakturMaguntia","Old English Text MT",serif;font-weight:400;font-size:1.55rem;line-height:1.1}
.hist summary span{color:var(--muted);font-size:.9rem;white-space:nowrap}
.hist .body{padding:0 14px 12px}
.hist table{width:100%;border-collapse:collapse;font-size:.95rem}
.hist td{padding:5px 0;border-top:1px solid var(--line);vertical-align:top}
.hist td:last-child{text-align:right;font-weight:600;padding-left:12px}
.hist .actions{display:flex;justify-content:flex-end;margin-top:10px}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
.status{color:var(--muted);font-size:.8rem;text-align:center;margin-top:18px;letter-spacing:.08em}

.toast{position:fixed;z-index:50;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:#0C0C0D;color:var(--ink);border:1px solid var(--red);box-shadow:0 0 16px rgba(196,18,31,.4);padding:10px 16px;border-radius:2px;font-weight:600;transition:opacity .2s,transform .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}


/* header with 3 tabs */
header{flex-direction:column;align-items:stretch;gap:14px}
h1{text-align:center}
.tabs{display:grid;grid-template-columns:repeat(3,1fr)}

/* study */
.panel{padding:0}
.panel summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.panel summary::-webkit-details-marker{display:none}
.panel summary::after{content:"+";color:var(--red-hi);font:700 1.5rem/1 "Barlow Condensed",sans-serif}
.panel[open] summary::after{content:"–"}
.panel .body{padding:0 16px 14px;color:#CFCFCF}
.panel .body p{margin:0 0 10px}
.panel .body ul{margin:0 0 10px;padding-left:18px}
.panel .body li{margin-bottom:7px}
.panel .body li::marker{color:var(--red)}
.panel .body strong{color:var(--ink)}
.chart{display:block;width:100%;height:auto;margin:4px 0 8px}
.chart text{fill:var(--muted);font:600 10px "Barlow Condensed",sans-serif;letter-spacing:.04em}
.charts2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.charts2 figure{margin:0}
.charts2 figcaption{text-align:center;color:var(--ink);font:600 .95rem "Barlow Condensed",sans-serif;letter-spacing:.06em}
.legend{display:flex;gap:18px;justify-content:center;color:var(--muted);font-size:.85rem;margin:0 0 12px}
.legend i{display:inline-block;width:22px;height:0;border-top:2px solid var(--bone);vertical-align:middle;margin-right:6px}
.legend i.d{border-top:2px dashed var(--red-hi)}
.note{border-left:2px solid var(--red);padding-left:10px;color:var(--muted)}
.src{color:var(--muted);font-size:.8rem;text-align:center;margin:6px 0 0}
.q{margin:0 0 18px}
.q > p{color:var(--ink);font-weight:600;margin:0 0 8px}
.opts{display:grid;gap:6px}
.opt{text-align:left;background:var(--field);border:1px solid var(--line);color:var(--ink);padding:10px 12px;border-radius:2px;font:500 1rem "Barlow",sans-serif;cursor:pointer;min-height:44px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--bone);box-shadow:0 0 12px rgba(214,214,214,.25)}
.opt.wrong{border-color:var(--red);color:var(--red-hi)}
.qfb{color:var(--muted);font-size:.9rem;margin:8px 0 0}
.score{text-align:center;font-family:"UnifrakturMaguntia","Old English Text MT",serif;font-size:1.6rem;margin:4px 0 0;text-shadow:0 0 14px rgba(196,18,31,.5)}


/* streak sticker */
.hrow{display:grid;grid-template-columns:58px 1fr 58px;align-items:center;gap:6px}
.hrow h1{font-size:clamp(1.6rem,7.4vw,2.1rem)}
.streak{position:relative;width:58px;height:70px;padding:0;border:0;background:none;cursor:pointer;transform:rotate(9deg);justify-self:end}
.streak svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 3px 4px rgba(0,0,0,.7))}
.streak .edge{fill:none;stroke:#E6E6E6;stroke-width:5;stroke-linejoin:round}
.streak .flame{transform-origin:32px 77px}
.streak span{position:absolute;left:0;right:0;top:58%;transform:translateY(-50%);text-align:center;font:700 1.3rem/1 "Barlow Condensed",sans-serif;color:#fff;text-shadow:0 0 3px #3a0508,0 1px 2px #000;font-variant-numeric:tabular-nums}
.streak.hot svg{filter:drop-shadow(0 0 10px rgba(227,32,47,.75)) drop-shadow(0 3px 4px rgba(0,0,0,.7))}
.streak.hot .flame{animation:flick 1.6s ease-in-out infinite}
.streak.warm svg{filter:saturate(.35) brightness(.8) drop-shadow(0 3px 4px rgba(0,0,0,.7))}
.streak.cold svg{filter:grayscale(1) brightness(.6)}
.streak.cold span{color:#bbb}
@keyframes flick{0%,100%{transform:scale(1,1)}30%{transform:scale(1.03,.97) skewX(-1.5deg)}60%{transform:scale(.98,1.04) skewX(1.5deg)}}
@media (prefers-reduced-motion: reduce){.streak.hot .flame{animation:none}}


/* failure sticker */
.setrow{grid-template-columns:48px 1fr 1fr 40px}
.fail{width:40px;height:40px;padding:0;border:0;background:none;cursor:pointer;transform:rotate(-8deg);transition:transform .15s}
.fail svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 2px 2px rgba(0,0,0,.7))}
.fail .edge{fill:none;stroke:#5E5E62;stroke-width:3;stroke-linejoin:round}
.fail .skull{fill:#2B2D31}
.fail .hole{fill:#0C0C0D}
.fail .teeth{stroke:#0C0C0D;stroke-width:1.2}
.fail.on{transform:rotate(-8deg) scale(1.1)}
.fail.on .edge{stroke:#E6E6E6}
.fail.on .skull{fill:#C4121F}
.fail.on .hole{fill:#050505}
.fail.on svg{filter:drop-shadow(0 0 7px rgba(227,32,47,.85)) drop-shadow(0 2px 2px rgba(0,0,0,.7))}
@media (prefers-reduced-motion: reduce){.fail{transition:none}}

.backup{display:flex;gap:8px;justify-content:center;margin:0 0 14px}

/* v2 additions */
.plate .dr{position:absolute;top:1px;right:1px;width:9px;height:9px;border-radius:50%;background:var(--bone);box-shadow:0 0 6px rgba(255,255,255,.6)}
.datebar{display:flex;justify-content:center;align-items:center;gap:10px;margin:-8px 0 20px;color:var(--muted);font:600 .95rem "Barlow Condensed",sans-serif;letter-spacing:.08em;flex-wrap:wrap}
.datebar input{background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:2px;padding:6px 10px;font:600 1rem "Barlow",sans-serif;min-height:40px;color-scheme:dark}
.extools{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mini{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:2px;padding:5px 10px;font:600 .85rem "Barlow Condensed",sans-serif;letter-spacing:.06em;cursor:pointer;min-height:34px}
.mini:hover:not(:disabled){color:var(--ink);border-color:var(--bone)}
.mini:disabled{opacity:.35;cursor:default}
.swapnote{color:var(--bone);margin-top:-6px}
.field.miss input{border-color:var(--red);box-shadow:0 0 0 1px var(--red),0 0 12px rgba(196,18,31,.45)}
.banner{background:var(--surface);border:1px solid var(--red);border-radius:2px;padding:12px 14px;margin:0 4px 14px;color:#CFCFCF;font-size:.92rem;display:grid;gap:10px}
.banner .ghost{justify-self:start}
.seg{display:grid;grid-template-columns:1fr 1fr;margin:0 4px 14px;border:1px solid var(--line);border-radius:2px}
.seg button{background:transparent;border:0;color:var(--muted);font:600 1rem "Barlow Condensed",sans-serif;letter-spacing:.1em;padding:8px;cursor:pointer}
.seg button[aria-selected="true"]{background:var(--red);color:#fff}
.bnote{margin:-6px 0 14px}
.bnote.overdue{color:var(--red-hi)}
.spark{display:block;width:100%;max-width:240px;height:auto;margin-top:6px}
.prog .meta{margin:2px 0}
.hist .actions{gap:8px}
.editform .editex{border-top:1px solid var(--line);padding:10px 0 4px}
.editform h4{margin:0;font:700 1.1rem "Barlow Condensed",sans-serif;letter-spacing:.03em}
.editform .datebar{margin:4px 0 10px;justify-content:flex-start}
.ghost.save{color:#fff;background:var(--red);border-color:var(--red-hi)}

/* splash */
.splash{position:fixed;inset:0;z-index:100;background:#050505;color:#E9E9E9;display:grid;place-items:center;overflow:hidden;cursor:pointer;transition:opacity .35s ease}
.splash.out{opacity:0;pointer-events:none}
.splash .corner{position:absolute;width:min(32vw,190px);height:auto;color:#D6D6D6}
.splash .tl{top:env(safe-area-inset-top,0px);left:0}
.splash .tr{top:env(safe-area-inset-top,0px);right:0;transform:scaleX(-1)}
.splash .bl{bottom:env(safe-area-inset-bottom,0px);left:0;transform:scaleY(-1)}
.splash .br{bottom:env(safe-area-inset-bottom,0px);right:0;transform:scale(-1,-1)}
.splash .script{position:absolute;top:calc(env(safe-area-inset-top,0px) + 9vh);left:50%;transform:translateX(-50%);width:min(78vw,420px);opacity:.3;color:#CFCFCF}
.splash .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:sp-draw .9s ease-out forwards}
.splash-center{position:relative;display:grid;justify-items:center}
.sigil{width:min(80vmin,420px);height:auto;animation:sp-glow 1.1s ease-in-out .7s both}
.sigil .core{transform-origin:200px 200px;animation:sp-sigil .7s cubic-bezier(.2,.9,.2,1) .1s both}
.splash-title{font-family:"UnifrakturMaguntia","Old English Text MT",serif;font-weight:400;font-size:clamp(2.6rem,12vw,4.4rem);line-height:1;margin:-10vmin 0 0;text-align:center;opacity:0;animation:sp-in .45s ease .7s forwards;text-shadow:0 0 18px rgba(196,18,31,.45)}
.splash-sub{font:600 1rem "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.35em;color:#9A9A9A;margin:10px 0 0;opacity:0;animation:sp-in .45s ease .9s forwards}
.sp-bar{position:relative;width:min(62vw,260px);height:3px;background:#1C1C1E;margin:26px auto 0;opacity:0;animation:sp-in .4s ease .5s forwards}
.sp-bar::before,.sp-bar::after{content:"";position:absolute;top:50%;width:7px;height:7px;background:#D6D6D6;transform:translateY(-50%) rotate(45deg)}
.sp-bar::before{left:-12px}
.sp-bar::after{right:-12px;background:#C4121F;box-shadow:0 0 8px rgba(227,32,47,.9)}
.sp-bar i{position:absolute;inset:0;transform-origin:left center;transform:scaleX(0);background:linear-gradient(90deg,#6E0A11,#E3202F);box-shadow:0 0 10px rgba(227,32,47,.85)}
.sp-pct{margin:10px 0 0;text-align:center;color:#8A8A8A;font:600 .85rem "Barlow Condensed",sans-serif;letter-spacing:.3em;opacity:0;animation:sp-in .4s ease .5s forwards;font-variant-numeric:tabular-nums}
@keyframes sp-draw{to{stroke-dashoffset:0}}
@keyframes sp-sigil{from{opacity:0;transform:scale(.35) rotate(-25deg)}to{opacity:1;transform:none}}
@keyframes sp-glow{0%{filter:drop-shadow(0 0 0 rgba(196,18,31,0))}50%{filter:drop-shadow(0 0 14px rgba(230,20,35,.8))}100%{filter:drop-shadow(0 0 5px rgba(196,18,31,.5))}}
@keyframes sp-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){
  .splash .draw,.sigil,.sigil .core,.splash-title,.splash-sub,.sp-bar,.sp-pct{animation:none;opacity:1;stroke-dashoffset:0}
}
</style>
</head>
<body>
<div class="splash" id="splash" aria-label="Welcome">
  <div class="splash-center">
    <svg class="sigil" viewBox="0 0 400 400" aria-hidden="true">
      <g class="core" id="sigilCore" fill="#C4121F">
        <ellipse cx="200" cy="200" rx="40" ry="15" fill="none" stroke="#C4121F" stroke-width="2"/>
        <ellipse cx="200" cy="200" rx="40" ry="15" fill="none" stroke="#C4121F" stroke-width="1.2" transform="rotate(90 200 200)"/>
        <circle cx="200" cy="200" r="62" fill="none" stroke="#C4121F" stroke-width="1" stroke-dasharray="2 9"/>
        <path d="M200 186 L207 200 L200 214 L193 200Z"/>
      </g>
    </svg>
    <h2 class="splash-title">Upper / Lower</h2>
    <p class="splash-sub">welcome back</p>
    <div class="sp-bar" id="spBar" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="spFill"></i></div>
    <p class="sp-pct" id="spPct">0%</p>
  </div>
</div>
<div class="bgdeco" id="bgdeco" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <div class="hrow">
      <span aria-hidden="true"></span>
      <h1>Upper/Lower Log</h1>
      <button class="streak cold" id="streak" aria-label="Training streak">
        <svg viewBox="0 0 64 80" aria-hidden="true">
          <defs>
            <linearGradient id="flameG" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0" stop-color="#5E0810"/><stop offset=".45" stop-color="#C4121F"/>
              <stop offset=".8" stop-color="#E3202F"/><stop offset="1" stop-color="#FF6A2B"/>
            </linearGradient>
            <linearGradient id="coreG" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0" stop-color="#FF4A2A"/><stop offset="1" stop-color="#FFD9B0"/>
            </linearGradient>
          </defs>
          <g class="flame">
            <path class="edge" d="M32 3 C36 15 44 19 47 29 C49 25 49 21 48 17 C56 26 58 38 55 50 C52 65 43 76 32 77 C20 76 10 66 9 52 C8 42 12 34 17 28 C17 33 19 37 22 39 C21 30 24 22 29 16 C30 21 31 24 33 26 C33 18 33 10 32 3Z"/>
            <path fill="url(#flameG)" d="M32 3 C36 15 44 19 47 29 C49 25 49 21 48 17 C56 26 58 38 55 50 C52 65 43 76 32 77 C20 76 10 66 9 52 C8 42 12 34 17 28 C17 33 19 37 22 39 C21 30 24 22 29 16 C30 21 31 24 33 26 C33 18 33 10 32 3Z"/>
            <path fill="url(#coreG)" opacity=".9" d="M33 38 C36 46 42 50 42 59 C42 67 37 72 32 72 C26 72 22 67 22 61 C22 55 26 52 28 47 C29 51 31 52 32 52 C31 47 31 43 33 38Z"/>
          </g>
        </svg>
        <span id="streakNum">0</span>
      </button>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-today" aria-selected="true">Today</button>
      <button role="tab" id="tab-history" aria-selected="false">History</button>
      <button role="tab" id="tab-study" aria-selected="false">Study</button>
    </div>
  </header>
  <main id="view"></main>
  <p class="status" id="status">Saved on this device</p>
</div>
<div class="savebar" id="savebar"><div class="inner"><button class="primary" id="saveBtn">Save session</button></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const PROGRAM = [
  {id:"UA", short:"UA", name:"Upper A", focus:"Shoulder focus", c:"#C4121F", pc:"#fff", ex:[
    ["Machine shoulder press",2,"4-7"],["Cable lateral raise",2,"5-8"],["Rear delt fly",2,"5-8"],
    ["Single-arm lat pulldown",1,"4-7"],["Close-grip pulldown",1,"4-7"],["Chest-supported row",1,"4-7"],
    ["Pec deck",1,"4-7"],["Rope triceps extension",2,"5-8"],["Cable curl",2,"5-8"]]},
  {id:"LA", short:"LA", name:"Lower A", focus:"Quad focus", c:"#D6D6D6", pc:"#050505", ex:[
    ["Hack squat",2,"4-7"],["Leg extension",2,"5-8"],["Stiff-legged deadlift",2,"4-7"],
    ["Lying leg curl",1,"5-8"],["Calf raise",2,"5-8"]]},
  {id:"UB", short:"UB", name:"Upper B", focus:"Arm focus", c:"#C4121F", pc:"#fff", ex:[
    ["JM press",2,"4-7"],["Preacher curl",2,"5-8"],["Overhead triceps extension",2,"5-8"],
    ["Hammer curl",2,"5-8"],["Cable lateral raise",2,"5-8"],["Rear delt fly",2,"5-8"],
    ["Single-arm lat pulldown",1,"4-7"],["Close-grip pulldown",1,"4-7"],["Incline press",1,"4-7"],["Pec deck",1,"4-7"]]},
  {id:"LB", short:"LB", name:"Lower B", focus:"Hamstring focus", c:"#D6D6D6", pc:"#050505", ex:[
    ["Seated leg curl",2,"4-7"],["Hip thrust",2,"4-7"],["Hip adduction",2,"5-8"],
    ["Leg extension",1,"5-8"],["Calf raise",2,"5-8"]]},
  {id:"UC", short:"UC", name:"Upper C", focus:"Back and chest, then delts", c:"#C4121F", pc:"#fff", ex:[
    ["Incline Smith press",2,"4-7"],["Single-arm lat pulldown",2,"4-7"],["Chest-supported row",2,"4-7"],
    ["Close-grip pulldown",1,"4-7"],["Pec deck",1,"4-7"],["Cable lateral raise",2,"5-8"],
    ["Rear delt fly",2,"5-8"],["Rope triceps extension",2,"5-8"],["Cable curl",2,"5-8"]]},
  {id:"LC", short:"LC", name:"Lower C", focus:"Quads and glutes", c:"#D6D6D6", pc:"#050505", ex:[
    ["Pendulum or Smith squat",2,"4-7"],["Stiff-legged deadlift",2,"4-7"],["Lying leg curl",1,"5-8"],
    ["Hip thrust",1,"4-7"],["Calf raise",2,"5-8"]]},
  {id:"REST", short:"R", name:"Rest", focus:"Recovery day", c:"#555", pc:"#E6E6E6", ex:[]}
];

const ORN = `<svg class="orn" viewBox="0 0 260 14" aria-hidden="true"><path d="M0 7 H110 M150 7 H260 M110 7 L118 2.5 M110 7 L118 11.5 M150 7 L142 2.5 M150 7 L142 11.5" stroke="currentColor" stroke-width="1" fill="none"/><path d="M130 0 L137 7 L130 14 L123 7Z" fill="currentColor"/></svg>`;
const SKULL_D = "M16 3 C9 3 5 8 5 14 C5 18 7 20 9 21 V25 C9 26 10 27 11 27 H21 C22 27 23 26 23 25 V21 C25 20 27 18 27 14 C27 8 23 3 16 3Z";
const SKULL = `<svg viewBox="0 0 32 32" aria-hidden="true"><path class="edge" d="${SKULL_D}"/><path class="skull" d="${SKULL_D}"/><circle class="hole" cx="11.5" cy="14" r="3.2"/><circle class="hole" cx="20.5" cy="14" r="3.2"/><path class="hole" d="M16 17.5 L14.3 20.5 H17.7Z"/><path class="teeth" d="M13 23 V27 M16 23 V27 M19 23 V27"/></svg>`;
const LS_KEY = "ul-log-v1", DRAFT_KEY = "ul-log-draft-v1";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
function lsGet(k){ try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }
function lsSet(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }


// ---- splash ----
(function splash(){
  const el = $("#splash"); if (!el) return;
  const NS = "http://www.w3.org/2000/svg";
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  // red thorn sigil, mirrored left/right
  const core = $("#sigilCore");
  const spike = (a, r0, len, w, c) => {
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", `M${-w/2} 0 Q${c*1.4 - w*0.3} ${-len*0.5} ${c*3} ${-len} Q${c*1.4 + w*0.3} ${-len*0.5} ${w/2} 0Z`);
    p.setAttribute("transform", `translate(200 200) rotate(${a}) translate(0 ${-r0})`);
    core.appendChild(p);
  };
  spike(0, 18, 150, 14, 0); spike(180, 18, 178, 14, 0);
  [[28,26,112,10,18],[55,24,132,11,-22],[80,22,96,9,26],[105,24,122,10,-18],[135,26,102,9,22],[157,30,72,7,-14],
   [18,72,42,5,10],[66,82,36,5,-8],[120,76,40,5,9],[162,92,30,4,-7],
   [44,122,62,2.5,12],[94,112,56,2.5,-10],[146,132,50,2.5,10]]
   .forEach(([a,r,l,w,c]) => { spike(a,r,l,w,c); spike(-a,r,l,w,-c); });

  // white filigree corners
  const corner = window.__CORNER = `<svg viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" aria-hidden="true">
    <path class="draw" pathLength="1" d="M8 192 V8 H192"/>
    <path class="draw" pathLength="1" d="M18 172 V32 C18 23 23 18 32 18 H172"/>
    <path class="draw" pathLength="1" d="M30 30 C62 30 72 52 56 64 C44 72 32 60 42 51 C48 46 55 52 50 57"/>
    <path class="draw" pathLength="1" d="M18 112 C42 102 46 80 30 72 M112 18 C102 42 80 46 72 30"/>
    <path class="draw" pathLength="1" d="M8 8 L46 46 C52 52 60 50 62 44"/>
    <path class="draw" pathLength="1" d="M18 140 C30 136 34 128 28 122 M140 18 C136 30 128 34 122 28"/>
    <path d="M192 4 L196 8 L192 12 L188 8Z M4 192 L8 188 L12 192 L8 196Z" fill="currentColor" stroke="none"/>
  </svg>`;
  ["tl","tr","bl","br"].forEach(k => {
    const d = document.createElement("div"); d.className = "corner " + k; d.innerHTML = corner; el.appendChild(d);
  });

  // faux handwritten script lines
  let lines = "";
  for (let i = 0; i < 8; i++){
    const y = 12 + i * 18; let x = 14 + rnd() * 12; let d = `M${x.toFixed(1)} ${y}`;
    while (x < 270){
      const end = Math.min(x + 18 + rnd() * 42, 286);
      while (x < end){
        const h = 3 + rnd() * 6, s = 4 + rnd() * 3;
        d += ` q${(s/2).toFixed(1)} ${(-h).toFixed(1)} ${s.toFixed(1)} 0`; x += s;
        if (rnd() < 0.18){ d += ` q${(s/2).toFixed(1)} ${(h*0.8).toFixed(1)} ${s.toFixed(1)} 0`; x += s; }
      }
      x += 6 + rnd() * 8; d += ` M${x.toFixed(1)} ${(y + (rnd() - 0.5) * 2).toFixed(1)}`;
    }
    lines += `<path class="draw" pathLength="1" style="animation-delay:${(i*0.06).toFixed(2)}s" d="${d}"/>`;
  }
  window.__SCRIPT = lines;
  const bg = $("#bgdeco");
  if (bg){
    const still = x => x.replace(/ class="draw" pathLength="1"( style="[^"]*")?/g, "");
    ["tl","tr","bl","br"].forEach(k => { const d = document.createElement("div"); d.className = "corner " + k; d.innerHTML = still(corner); bg.appendChild(d); });
    const bs = document.createElement("div"); bs.className = "script";
    bs.innerHTML = `<svg viewBox="0 0 300 160" fill="none" stroke="currentColor" stroke-width=".8" stroke-linecap="round">${still(lines)}</svg>`;
    bg.appendChild(bs);
  }
  const sc = document.createElement("div"); sc.className = "script";
  sc.innerHTML = `<svg viewBox="0 0 300 160" fill="none" stroke="currentColor" stroke-width=".8" stroke-linecap="round" aria-hidden="true">${lines}</svg>`;
  el.prepend(sc);

  const done = () => {
    if (el.classList.contains("out")) return;
    el.classList.add("out"); setTimeout(() => el.remove(), 400);
  };
  const FILL = 3500, TOTAL = 3650; // fade takes ~0.35s, so it's gone at 4s
  const fill = $("#spFill"), pct = $("#spPct"), bar = $("#spBar");
  const t0 = performance.now();
  const tick = now => {
    const x = Math.min((now - t0) / FILL, 1);
    // uneven, "loading" feel: fast start, a stall around 70%, then a final push
    const e = x < 0.55 ? 0.7 * (1 - Math.pow(1 - x / 0.55, 2)) : x < 0.8 ? 0.7 + 0.08 * ((x - 0.55) / 0.25) : 0.78 + 0.22 * Math.pow((x - 0.8) / 0.2, 1.6);
    const v = Math.round(e * 100);
    fill.style.transform = `scaleX(${e})`; pct.textContent = v + "%"; bar.setAttribute("aria-valuenow", v);
    if (x < 1 && !el.classList.contains("out")) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  setTimeout(done, TOTAL);
  el.addEventListener("click", done);
  document.addEventListener("keydown", done, { once: true });
})();

// ---------- state ----------
const pad = n => String(n).padStart(2, "0");
const localStr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => localStr(new Date());
function isoFor(dateStr){
  if (dateStr === todayStr()) return new Date().toISOString();
  const [y, m, d] = dateStr.split("-").map(Number);
  return new Date(y, m - 1, d, 12).toISOString();
}
const idxOf = id => PROGRAM.findIndex(p => p.id === id);

let state = lsGet(LS_KEY) || { nextIdx: 0, sessions: [] };
let draft = lsGet(DRAFT_KEY) || {};
draft.values = draft.values || {}; draft.swaps = draft.swaps || {}; draft.extra = draft.extra || {};
let selIdx = Number.isInteger(draft.dayIdx) ? draft.dayIdx : state.nextIdx;
let tab = "today", histView = "sessions";
let logDate = todayStr();
let missing = new Set();          // "key:i" sets with weight/failure but no reps (Today)
let editing = null;               // { id, date, values:{name:[{w,r,f}]}, missing:Set }

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), msg.length > 45 ? 3400 : 2200);
}
const glow = p => p.c === "#C4121F" ? "rgba(196,18,31,.6)" : p.c === "#D6D6D6" ? "rgba(214,214,214,.3)" : "transparent";
function saveDraft(){ draft.dayIdx = selIdx; lsSet(DRAFT_KEY, draft); }
function cacheState(){ lsSet(LS_KEY, state); }
function sortSessions(){ state.sessions.sort((a, b) => b.date.localeCompare(a.date)); }
function syncNext(){
  const last = state.sessions[0];
  state.nextIdx = last && idxOf(last.dayId) >= 0 ? (idxOf(last.dayId) + 1) % PROGRAM.length : 0;
}
// which day the rotation expects for a given date (based on the last session before it)
function expectedIdxFor(iso){
  const prev = state.sessions.find(s => s.date < iso);
  return prev && idxOf(prev.dayId) >= 0 ? (idxOf(prev.dayId) + 1) % PROGRAM.length : state.nextIdx;
}
function hasDraft(dayId){
  return Object.entries(draft.values).some(([k, arr]) => k.startsWith(dayId + ":") && (arr || []).some(v => v && (v.w || v.r || v.f)));
}
function lastFor(name){
  for (const s of state.sessions){
    const e = (s.entries || []).find(e => e.name === name && e.sets && e.sets.length);
    if (e) return e.sets;
  }
  return null;
}
const e1 = s => { const w = parseFloat(s.w), r = parseInt(s.r, 10); return w > 0 && r > 0 ? w * (1 + r / 30) : 0; };
const bestE1 = name => state.sessions.reduce((b, s) => Math.max(b, ...(s.entries || []).filter(e => e.name === name).flatMap(e => e.sets.map(e1)), 0), 0);
const fmtSets = sets => sets.map(s => (s.w !== "" && s.w != null ? s.w + "×" : "") + s.r + (s.f ? "†" : "")).join(", ");
const fmtDate = iso => new Date(iso).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
const isStandalone = () => (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

const dayNum = iso => { const d = new Date(iso); return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5; };
function streakInfo(){
  const asc = [...state.sessions].sort((a, b) => a.date.localeCompare(b.date));
  const idx = id => PROGRAM.findIndex(p => p.id === id);
  let chain = new Set(), best = 0;
  asc.forEach((s, i) => {
    if (i > 0){
      const prev = asc[i - 1], gap = dayNum(s.date) - dayNum(prev.date);
      const inOrder = idx(prev.dayId) >= 0 && (idx(prev.dayId) + 1) % PROGRAM.length === idx(s.dayId);
      if (!inOrder || gap > 1) chain = new Set();
    }
    chain.add(dayNum(s.date));
    best = Math.max(best, chain.size);
  });
  const today = dayNum(new Date().toISOString());
  const last = asc.length ? dayNum(asc[asc.length - 1].date) : null;
  const alive = last !== null && today - last <= 1;
  return { current: alive ? chain.size : 0, best, loggedToday: last === today };
}
function renderStreak(){
  const st = streakInfo(), el = $("#streak");
  el.classList.remove("hot", "warm", "cold");
  el.classList.add(st.current === 0 ? "cold" : st.loggedToday ? "hot" : "warm");
  $("#streakNum").textContent = st.current;
  el.setAttribute("aria-label", `Training streak: ${st.current} days`);
}
function streakToast(){
  const st = streakInfo();
  if (st.current === 0) toast("No streak yet. Log every day in rotation order, rest days included.");
  else if (st.loggedToday) toast(`${st.current}-day streak. Best: ${st.best}.`);
  else toast(`${st.current}-day streak. Log ${PROGRAM[state.nextIdx].name} today to keep it.`);
}


// ---------- render ----------
function render(){
  $("#tab-today").setAttribute("aria-selected", tab === "today");
  $("#tab-history").setAttribute("aria-selected", tab === "history");
  $("#tab-study").setAttribute("aria-selected", tab === "study");
  $("#savebar").style.display = tab === "today" ? "" : "none";
  if (tab === "today") renderToday(); else if (tab === "history") renderHistory(); else renderStudy();
  renderStreak();
}

const setRow = (attrs, i, v, l, miss, label) => `<div class="setrow">
  <span>Set ${i + 1}</span>
  <label class="field"><input inputmode="decimal" ${attrs} data-i="${i}" data-f="w" value="${esc(v.w || "")}" placeholder="${esc(l.w ?? "")}" aria-label="${label} set ${i + 1} weight"><em>kg</em></label>
  <label class="field ${miss ? "miss" : ""}"><input inputmode="numeric" ${attrs} data-i="${i}" data-f="r" value="${esc(v.r || "")}" placeholder="${esc(l.r ?? "")}" aria-label="${label} set ${i + 1} reps"><em>reps</em></label>
  <button class="fail ${v.f ? "on" : ""}" ${attrs.replace(/data-(e?)key=/, "data-$1fkey=")} data-i="${i}" aria-pressed="${!!v.f}" aria-label="${label} set ${i + 1} taken to failure">${SKULL}</button>
</div>`;

function renderToday(){
  const d = PROGRAM[selIdx];
  const plates = PROGRAM.map((p, i) => `
    <button class="plate ${p.id === "REST" ? "rest" : ""}" style="--c:${p.c};--pc:${p.pc};--glow:${glow(p)}" data-day="${i}"
      aria-pressed="${i === selIdx}" aria-label="${esc(p.name)}${i === state.nextIdx ? " (up next)" : ""}${hasDraft(p.id) ? " (unsaved entries)" : ""}">
      <b>${esc(p.short)}</b>${i === state.nextIdx ? '<i class="next"></i>' : ""}${hasDraft(p.id) ? '<i class="dr"></i>' : ""}
    </button>`).join("");

  const banner = isMobile && !isStandalone() && !lsGet("ul-log-banner-ok") ? `<div class="banner">
    You're in the browser. On iPhone, the browser and the home-screen app keep separate data, so add the app to your home screen and log there.
    <button class="ghost" id="bannerOk">Got it</button></div>` : "";

  const dateBar = `<div class="datebar"><label for="logDate">Logging for</label>
    <input type="date" id="logDate" value="${logDate}" max="${todayStr()}">
    ${logDate !== todayStr() ? `<button class="mini" id="dateToday">Today</button>` : ""}</div>`;

  let body;
  if (d.id === "REST"){
    body = `<div class="restbox">Rest day. Nothing to lift. Mark it done so your streak keeps burning.</div>`;
    $("#saveBtn").textContent = "Mark rest day done";
  } else {
    $("#saveBtn").textContent = "Save session";
    body = d.ex.map(([orig, baseSets, range]) => {
      const key = d.id + ":" + orig;
      const name = draft.swaps[key] || orig;
      const extra = draft.extra[key] || 0;
      const sets = baseSets + extra;
      const vals = draft.values[key] || [];
      const last = lastFor(name);
      const top = parseInt(range.split("-")[1], 10);
      const hitTop = last && last.length >= baseSets && last.every(s => Number(s.r) >= top);
      const hasLastW = last && last.some(s => s.w);
      const rows = Array.from({ length: sets }, (_, i) =>
        setRow(`data-key="${esc(key)}"`, i, vals[i] || {}, (last && last[i]) || {}, missing.has(key + ":" + i), esc(name))).join("");
      return `<section class="ex">
        <h3>${esc(name)}</h3>
        <p class="meta">Target ${baseSets} × ${range.replace("-", "–")} reps${extra ? ` (+${extra} extra today)` : ""}${last ? ". Last time: " + esc(fmtSets(last)) : ""}</p>
        ${name !== orig ? `<p class="meta swapnote">Swapped from ${esc(orig)} for today.</p>` : ""}
        ${hitTop ? `<p class="hint">Hit the top of the range last time. Add weight.</p>` : ""}
        ${rows}
        <div class="extools">
          <button class="mini" data-lastw="${esc(key)}" ${hasLastW ? "" : "disabled"}>Last weights</button>
          <button class="mini" data-swap="${esc(key)}">Swap</button>
          <button class="mini" data-addset="${esc(key)}">+ Set</button>
          ${extra ? `<button class="mini" data-rmset="${esc(key)}">− Set</button>` : ""}
        </div>
      </section>`;
    }).join("");
  }

  const upNext = selIdx === state.nextIdx && logDate === todayStr();
  $("#view").innerHTML = `${banner}
    <div class="plates" role="group" aria-label="Choose day">${plates}</div>
    <div class="dayhead" style="--c:${d.c};--glow:${glow(d)}">
      <h2>${esc(d.name)}</h2>${ORN}<p>${esc(d.focus)}${upNext ? ", up next in your rotation" : ""}</p>
    </div>
    ${dateBar}
    ${body}`;
}

function backupHtml(){
  const le = lsGet("ul-log-lastexport");
  const days = le ? Math.floor((Date.now() - le) / 864e5) : null;
  const overdue = state.sessions.length >= 3 && (days === null || days >= 14);
  const note = le ? `Last backup: ${days === 0 ? "today" : days === 1 ? "yesterday" : days + " days ago"}` : "No backup yet";
  return `<div class="backup"><button class="ghost" id="exportBtn">Export backup</button><button class="ghost" id="importBtn">Import backup</button><input type="file" id="importFile" accept="application/json,.json" hidden></div>
    <p class="status bnote ${overdue ? "overdue" : ""}">${note}</p>`;
}

function renderHistory(){
  const seg = `<div class="seg" role="tablist">
    <button role="tab" data-hview="sessions" aria-selected="${histView === "sessions"}">Sessions</button>
    <button role="tab" data-hview="progress" aria-selected="${histView === "progress"}">Progress</button></div>`;
  if (histView === "progress"){ $("#view").innerHTML = backupHtml() + seg + progressHtml(); return; }
  if (!state.sessions.length){
    $("#view").innerHTML = backupHtml() + seg + `<p class="empty">No sessions yet. Log your first one on the Today tab.</p>`;
    return;
  }
  $("#view").innerHTML = backupHtml() + seg + `<p class="status" style="margin:0 0 12px">† = taken to failure</p><div class="hist">` + state.sessions.map(s => {
    const p = PROGRAM.find(p => p.id === s.dayId) || PROGRAM[6];
    const n = (s.entries || []).reduce((a, e) => a + e.sets.length, 0);
    const isEdit = editing && editing.id === s.id;
    const rows = (s.entries || []).map(e => `<tr><td>${esc(e.name)}</td><td>${esc(fmtSets(e.sets))}</td></tr>`).join("");
    return `<details style="--c:${p.c}" ${isEdit ? "open" : ""}>
      <summary><strong>${esc(s.dayName)}</strong><span>${esc(fmtDate(s.date))}${p.id !== "REST" ? ", " + n + (n === 1 ? " set" : " sets") : ""}</span></summary>
      <div class="body">${isEdit ? editForm(s, p) : `${rows ? `<table>${rows}</table>` : ""}
        <div class="actions"><button class="ghost" data-edit="${esc(s.id)}">Edit</button><button class="ghost" data-del="${esc(s.id)}">Delete</button></div>`}
      </div></details>`;
  }).join("") + `</div>`;
}

function editForm(s, p){
  const names = [...new Set([...(p.ex || []).map(x => x[0]), ...(s.entries || []).map(e => e.name)])];
  const base = name => { const x = (p.ex || []).find(x => x[0] === name); return x ? x[1] : 0; };
  const blocks = p.id === "REST" ? "" : names.map(name => {
    const vals = editing.values[name] || [];
    const count = Math.max(base(name), vals.length, 1);
    return `<div class="editex"><h4>${esc(name)}</h4>${Array.from({ length: count }, (_, i) =>
      setRow(`data-ekey="${esc(name)}"`, i, vals[i] || {}, {}, editing.missing.has(name + ":" + i), esc(name))).join("")}
      <div class="extools"><button class="mini" data-eadd="${esc(name)}">+ Set</button></div></div>`;
  }).join("");
  return `<div class="editform">
    <div class="datebar"><label for="editDate">Date</label><input type="date" id="editDate" value="${editing.date}" max="${todayStr()}"></div>
    ${blocks}
    <div class="actions"><button class="ghost" id="editCancel">Cancel</button><button class="ghost save" id="editSave">Save changes</button></div>
  </div>`;
}

function progressHtml(){
  const map = {};
  [...state.sessions].reverse().forEach(s => (s.entries || []).forEach(e => {
    const best = e.sets.reduce((b, x) => e1(x) > e1(b) ? x : b, e.sets[0]);
    if (e1(best) > 0) (map[e.name] = map[e.name] || []).push({ date: s.date, v: e1(best), set: best });
  }));
  const order = [...new Set(PROGRAM.flatMap(p => p.ex.map(x => x[0])))];
  const names = Object.keys(map).sort((a, b) => (order.indexOf(a) + 1 || 999) - (order.indexOf(b) + 1 || 999));
  if (!names.length) return `<p class="empty">Log a few sessions with weights to see your progress here.</p>`;
  return `<p class="status" style="margin:0 0 12px">Best set per session, as estimated 1RM</p>` + names.map(name => {
    const pts = map[name], pr = pts.reduce((b, x) => x.v > b.v ? x : b), last = pts[pts.length - 1];
    const tail = pts.slice(-12);
    let spark = `<p class="meta">Log it twice to see a trend.</p>`;
    if (tail.length > 1){
      const min = Math.min(...tail.map(x => x.v)), max = Math.max(...tail.map(x => x.v)), span = max - min || 1;
      const xy = tail.map((x, i) => [4 + i * (112 / (tail.length - 1)), 28 - ((x.v - min) / span) * 22]);
      spark = `<svg class="spark" viewBox="0 0 120 32" aria-hidden="true"><polyline points="${xy.map(p => p.map(n => n.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="var(--bone)" stroke-width="1.5"/>
        <circle cx="${xy[xy.length - 1][0].toFixed(1)}" cy="${xy[xy.length - 1][1].toFixed(1)}" r="3" fill="var(--red-hi)"/></svg>`;
    }
    return `<section class="ex prog"><h3>${esc(name)}</h3>
      <p class="meta"><strong>PR:</strong> ${esc(fmtSets([pr.set]))} (≈${Math.round(pr.v)} kg 1RM), ${esc(fmtDate(pr.date))}</p>
      <p class="meta">Last: ${esc(fmtSets([last.set]))} (≈${Math.round(last.v)} kg), ${esc(fmtDate(last.date))}</p>
      ${spark}</section>`;
  }).join("");
}

const QUIZ = [
  ["Which process actually builds contractile tissue?", ["MPS", "MyoPS", "Glycogen synthesis", "Cortisol release"], 1,
   "MyoPS happens in the myofibrils. MPS also includes general repair of damage."],
  ["How many sets per exercise does he program at most?", ["1", "2", "3", "4"], 1,
   "Past about two sets, returns drop fast and the damage piles up."],
  ["Which part of the hamstrings do stiff-legged deadlifts miss?", ["Semitendinosus", "Biceps femoris long head", "Biceps femoris short head", "Semimembranosus"], 2,
   "The short head only crosses the knee, so you need leg curls."],
  ["Why is the triceps long head shut off in presses?", ["It only works at high reps", "Shoulder flexion works against its shoulder-extension role", "It's too small to contribute", "The grip is too narrow"], 1,
   "It's stretched at one end and shortened at the other, like a rubber band that does no work."],

let quizAns = {};

function renderStudy(){
  const quiz = QUIZ.map(([q, opts, right, why], qi) => {
    const a = quizAns[qi];
    return `<div class="q"><p>${qi+1}. ${esc(q)}</p><div class="opts">${opts.map((o, oi) => {
      const cls = a === undefined ? "" : oi === right ? "right" : oi === a ? "wrong" : "";
      return `<button class="opt ${cls}" data-q="${qi}" data-o="${oi}" ${a !== undefined ? "disabled" : ""}>${esc(o)}</button>`;
    }).join("")}</div>${a !== undefined ? `<p class="qfb">${a === right ? "Correct." : "Wrong."} ${esc(why)}</p>` : ""}</div>`;
  }).join("");
  const answered = Object.keys(quizAns).length;
  const score = Object.entries(quizAns).filter(([qi, a]) => QUIZ[qi][2] === a).length;

  const panel = (title, body, open) => `<details class="ex panel"${open ? " open" : ""}><summary><h3>${title}</h3></summary><div class="body">${body}</div></details>`;

  $("#view").innerHTML = `
    <div class="dayhead" style="--c:#C4121F;--glow:rgba(196,18,31,.6)">
      <h2>Study</h2>${ORN}<p>low volume, high frequency, explained</p>
    </div>
    <div class="study">
    ${panel("The core idea", `
      <p>Train each muscle with <strong>few, very hard sets</strong> and hit it <strong>often</strong>: at least twice a week, ideally more. Instead of one big session followed by days of recovery, you give the muscle short, efficient growth signals again and again.</p>
      <ul><li>At most 2 sets per exercise.</li><li>4–6 hard sets per joint action each week.</li><li>4–7 reps on stable exercises.</li><li>Upper/lower in a continuous loop.</li></ul>`, true)}

    ${panel("MPS vs MyoPS", `
      <p><strong>MPS</strong> (muscle protein synthesis) is general repair and rises from any training, even running. <strong>MyoPS</strong> (myofibrillar protein synthesis) happens in the contractile units and is what actually builds muscle.</p>
      ${CHART_MPS}
      <div class="legend"><span><i></i>MPS</span><span><i class="d"></i>MyoPS</span></div>
      <p>His argument: MyoPS rises over the first few sets and then flattens out, while MPS keeps climbing because the body is repairing damage. High MPS after huge volume mostly reflects damage, not growth.</p>`)}

    ${panel("Atrophy and frequency", `
      <p>MyoPS returns to baseline after about <strong>48–72 hours</strong>. After that, in his view, atrophy begins. Growth is "binary": you're either building or losing.</p>
      <div class="charts2"><figure>${miniChart(false)}<figcaption>Low volume</figcaption></figure><figure>${miniChart(true)}<figcaption>High volume</figcaption></figure></div>
      <div class="legend"><span><i></i>MPS / repair</span><span><i class="d"></i>MyoPS</span></div>
      <p>With high volume, the growth signal is over while you're still repairing damage, so you lose contractile tissue during recovery. With low volume, both return at the same time and you can train again right away at full quality.</p>
      <p class="note">Mechanical tension is the only driver of growth. Damage isn't a goal: marathon runners get lots of damage and small legs.</p>`)}

    ${panel("Fatigue and the nervous system", `
      <p>Fatigue isn't just feeling tired. It's negative feedback from the body that the brain can't ignore, and it builds up both during and after a session.</p>
      <p>Muscle damage sends inflammatory signals to the brain, which then lowers how hard you can drive <strong>every</strong> muscle. Damaged biceps from yesterday can mean worse quads today. Less volume means less damage, which means less of this brake. That's why he can train every day.</p>`)}

    ${panel("Joint actions and regions", `
      <p>Plan around <strong>joint actions</strong>, not just muscles. Different movements load different parts of the same muscle, and only the fibers under the highest tension grow.</p>
      <ul>
        <li><strong>Lats:</strong> adduction (arm down toward your side) biases the lower lats. Extension (arm backward) biases the upper lats.</li>
        <li><strong>Chest:</strong> shoulder flexion with slight adduction (incline) for upper chest. Horizontal adduction (pec deck) for mid chest.</li>
        <li><strong>Hamstrings:</strong> the biceps femoris short head doesn't work in hinges. You need leg curls.</li>
        <li><strong>Triceps:</strong> the long head is shut off in presses and JM presses because shoulder flexion works against it. Overhead or rope extensions hit all heads.</li>
      </ul>
      <p>Rotate across sessions. One day, 1 set of JM press + 1 set of rope extension. The next day, 2 sets of rope extension. That way no region goes too long without direct work. Indirect work (rows for biceps, presses for triceps) doesn't count.</p>`)}

    ${panel("Motor units and fiber types", `
      <p>Your brain has a limited amount of effort to hand out. Low reps and stable exercises lower the perceived effort, so more neural drive goes to the muscle and you recruit the hardest-to-reach <strong>type 2x fibers</strong>.</p>
      <p>Type 1 fibers are always active and get fully recruited whenever the 2x fibers are anyway. There's no point chasing them with high reps. The 2x fibers have the greatest growth potential, and they're also the fastest to atrophy.</p>`)}

    ${panel("How he runs the split", `
      <ul>
        <li>Upper/lower with no rest days. He says himself that most people should take rest days.</li>
        <li>Rotate the focus of upper days: shoulders, back, chest. The focus muscle goes first, with no extra volume.</li>
        <li>Arms last, since they're a strong point for him.</li>
        <li>Without rest days, leave 1 rep in reserve on some sets.</li>
        <li>Check your log each session. Did I hit this joint action last time? If not, prioritize it today.</li>
      </ul>`)}

    ${panel("From his other videos", `
      <ul>
        <li><strong>Heavy load wins.</strong> He does most sets at 5–7 reps, sometimes down to 4, and thinks most people would benefit from fewer sets and heavier weights. Past a certain point you only add fatigue for no extra stimulus.</li>
        <li><strong>Warm-ups:</strong> on one push day he did three warm-up sets on the first exercise and one on each after, then working sets of 6–8 reps to failure or close.</li>
        <li><strong>Weak points 2 sets, strong points 1:</strong> followers describe this from a newer video on the no-rest upper/lower.</li>
        <li><strong>Arms don't need more volume</strong>, and in his view neither does any other muscle. He's critical of coaches who sell high-volume programs.</li>
        <li><strong>Lats:</strong> he thinks the adduction component is generally more important to prioritize, but stresses that it depends on goals and program setup.</li>
        <li><strong>Mindset:</strong> he turns dissatisfaction with himself into drive, but still acknowledges his progress so he doesn't sink into self-pity.</li>
        <li><strong>Background:</strong> 5'11" (about 180 cm), 195–200 lb (about 88–91 kg), around 6.5 years of training according to his YouTube bio.</li>
      </ul>
      <p class="src">Clark Kent: @clarkybateman on TikTok, Clark.kvnt on Instagram</p>`)}

    ${panel("Reality check", `
      <p>He says himself that he isn't citing sources. This is his interpretation of physiology. Parts of it are well supported: mechanical tension drives growth, and each extra set gives less than the one before.</p>
      <p>Other parts are simplified. The idea that you're always either growing or atrophying is an oversimplification, and in many studies more weekly sets still give somewhat more growth up to fairly high levels. The approach works well in practice. Just treat the mechanisms as his model, not settled fact.</p>`)}

    ${panel("Pop quiz", quiz + (answered === QUIZ.length ? `<p class="score">${score} / ${QUIZ.length}</p>` : ""), answered > 0)}
    </div>`;
}


// ---------- backup ----------
async function exportBackup(){
  const json = JSON.stringify(state, null, 2);
  const name = "ul-log-backup-" + todayStr() + ".json";
  const done = () => { lsSet("ul-log-lastexport", Date.now()); render(); toast("Backup exported"); };
  try {
    const file = new File([json], name, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({ files: [file], title: "Upper/Lower Log backup" });
      return done();
    }
  } catch (e) { if (e && e.name === "AbortError") return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([json], { type: "application/json" }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  done();
}
async function importBackup(file){
  try {
    const data = JSON.parse(await file.text());
    if (!data || !Array.isArray(data.sessions)) throw new Error();
    if (!confirm(`Replace your log with this backup (${data.sessions.length} sessions)?`)) return;
    state = { nextIdx: 0, sessions: data.sessions };
    sortSessions(); syncNext(); cacheState(); selIdx = state.nextIdx; render(); toast("Backup imported");
  } catch { toast("That file isn't a valid backup."); }
}

// ---------- save / edit / delete ----------
function collectSets(vals, markMissing){
  const sets = [];
  (vals || []).forEach((v, i) => {
    if (!v) return;
    const r = String(v.r || "").trim(), w = String(v.w || "").trim();
    if (r) sets.push({ w: w.replace(",", "."), r, ...(v.f ? { f: true } : {}) });
    else if (w || v.f) markMissing(i);
  });
  return sets;
}

function saveSession(){
  const d = PROGRAM[selIdx];
  if (logDate > todayStr()){ toast("You can't log a future date."); return; }
  missing = new Set();
  const entries = [];
  d.ex.forEach(([orig, baseSets]) => {
    const key = d.id + ":" + orig;
    const vals = (draft.values[key] || []).slice(0, baseSets + (draft.extra[key] || 0));
    const sets = collectSets(vals, i => missing.add(key + ":" + i));
    if (sets.length) entries.push({ name: draft.swaps[key] || orig, sets });
  });
  if (missing.size){
    render();
    toast("Add reps or clear the weight on the highlighted sets.");
    const m = document.querySelector(".field.miss input"); if (m) m.scrollIntoView({ block: "center" });
    return;
  }
  if (d.id !== "REST" && !entries.length){ toast("Enter reps for at least one set to save."); return; }

  const date = isoFor(logDate);
  const expected = expectedIdxFor(date);
  if (selIdx !== expected && streakInfo().current > 0 &&
      !confirm(`${d.name} isn't next in your rotation (${PROGRAM[expected].name} is). Logging it breaks your streak. Log it anyway?`)) return;

  const prs = entries.filter(e => { const before = bestE1(e.name); return before > 0 && Math.max(...e.sets.map(e1)) > before; }).map(e => e.name);

  state.sessions.push({ id: Date.now().toString(36), date, dayId: d.id, dayName: d.name, entries });
  sortSessions(); syncNext(); cacheState();

  for (const obj of [draft.values, draft.swaps, draft.extra])
    Object.keys(obj).forEach(k => { if (k.startsWith(d.id + ":")) delete obj[k]; });
  selIdx = state.nextIdx; logDate = todayStr(); saveDraft();
  render(); window.scrollTo({ top: 0 });
  toast(d.id === "REST" ? "Rest day done" : prs.length ? `Session saved. New PR: ${prs.join(", ")}` : "Session saved");
}

function startEdit(id){
  const s = state.sessions.find(s => s.id === id); if (!s) return;
  const values = {};
  (s.entries || []).forEach(e => { values[e.name] = e.sets.map(x => ({ ...x })); });
  editing = { id, date: localStr(new Date(s.date)), values, missing: new Set() };
  render();
}
function saveEdit(){
  const s = state.sessions.find(s => s.id === editing.id); if (!s) return;
  if (editing.date > todayStr()){ toast("You can't move a session to a future date."); return; }
  editing.missing = new Set();
  const entries = [];
  Object.entries(editing.values).forEach(([name, vals]) => {
    const sets = collectSets(vals, i => editing.missing.add(name + ":" + i));
    if (sets.length) entries.push({ name, sets });
  });
  if (editing.missing.size){ render(); toast("Add reps or clear the weight on the highlighted sets."); return; }
  if (s.dayId !== "REST" && !entries.length){ toast("A session needs at least one set. Delete it instead."); return; }
  // keep existing entry order, then any newly filled exercises
  const order = [...(s.entries || []).map(e => e.name), ...entries.map(e => e.name)];
  s.entries = entries.sort((a, b) => order.indexOf(a.name) - order.indexOf(b.name));
  if (editing.date !== localStr(new Date(s.date))) s.date = isoFor(editing.date);
  sortSessions(); syncNext(); cacheState();
  editing = null; render(); toast("Changes saved");
}
function deleteSession(id){
  if (!confirm("Delete this session?")) return;
  state.sessions = state.sessions.filter(s => s.id !== id);
  syncNext(); cacheState();
  if (!Object.keys(draft.values).some(k => hasDraft(k.split(":")[0]))){ selIdx = state.nextIdx; saveDraft(); }
  render(); toast("Session deleted");
}

// ---------- events ----------
const dArr = (obj, key) => obj[key] || (obj[key] = []);
document.addEventListener("click", e => {
  const t = e.target;
  const plate = t.closest("[data-day]");
  if (plate){ selIdx = Number(plate.dataset.day); saveDraft(); render(); return; }

  const fb = t.closest("[data-fkey]");
  if (fb){
    const arr = dArr(draft.values, fb.dataset.fkey), i = Number(fb.dataset.i);
    arr[i] = arr[i] || {}; arr[i].f = !arr[i].f;
    fb.classList.toggle("on", arr[i].f); fb.setAttribute("aria-pressed", arr[i].f);
    saveDraft(); return;
  }
  const efb = t.closest("[data-efkey]");
  if (efb && editing){
    const arr = dArr(editing.values, efb.dataset.efkey), i = Number(efb.dataset.i);
    arr[i] = arr[i] || {}; arr[i].f = !arr[i].f;
    efb.classList.toggle("on", arr[i].f); efb.setAttribute("aria-pressed", arr[i].f); return;
  }
  const lw = t.closest("[data-lastw]");
  if (lw){
    const key = lw.dataset.lastw, name = draft.swaps[key] || key.split(":").slice(1).join(":");
    const last = lastFor(name) || [], arr = dArr(draft.values, key);
    last.forEach((s, i) => { if (s.w){ arr[i] = arr[i] || {}; if (!arr[i].w) arr[i].w = s.w; } });
    saveDraft(); render(); return;
  }
  const sw = t.closest("[data-swap]");
  if (sw){
    const key = sw.dataset.swap, orig = key.split(":").slice(1).join(":");
    const v = prompt(`Swap ${orig} for today. Enter the exercise you're doing instead (leave empty to undo):`, draft.swaps[key] || "");
    if (v === null) return;
    const name = v.trim();
    if (!name || name === orig) delete draft.swaps[key]; else draft.swaps[key] = name.slice(0, 60);
    saveDraft(); render(); return;
  }
  const add = t.closest("[data-addset]");
  if (add){ const k = add.dataset.addset; draft.extra[k] = Math.min((draft.extra[k] || 0) + 1, 4); saveDraft(); render(); return; }
  const rm = t.closest("[data-rmset]");
  if (rm){
    const k = rm.dataset.rmset, x = (draft.extra[k] || 0) - 1;
    if (x > 0) draft.extra[k] = x; else delete draft.extra[k];
    const base = (PROGRAM.find(p => k.startsWith(p.id + ":")).ex.find(e => e[0] === k.split(":").slice(1).join(":")) || [0, 0])[1];
    if (draft.values[k]) draft.values[k] = draft.values[k].slice(0, base + Math.max(x, 0));
    saveDraft(); render(); return;
  }
  const opt = t.closest("[data-q]");
  if (opt){
    quizAns[Number(opt.dataset.q)] = Number(opt.dataset.o);
    const y = window.scrollY; render(); window.scrollTo({ top: y }); return;
  }
  const hv = t.closest("[data-hview]");
  if (hv){ histView = hv.dataset.hview; editing = null; render(); return; }
  if (t.closest("#exportBtn")){ exportBackup(); return; }
  if (t.closest("#importBtn")){ $("#importFile").click(); return; }
  if (t.closest("#bannerOk")){ lsSet("ul-log-banner-ok", true); render(); return; }
  if (t.closest("#dateToday")){ logDate = todayStr(); render(); return; }
  const ed = t.closest("[data-edit]");
  if (ed){ startEdit(ed.dataset.edit); return; }
  const ea = t.closest("[data-eadd]");
  if (ea && editing){ dArr(editing.values, ea.dataset.eadd).push({}); render(); return; }
  if (t.closest("#editCancel")){ editing = null; render(); return; }
  if (t.closest("#editSave")){ saveEdit(); return; }
  const del = t.closest("[data-del]");
  if (del){ deleteSession(del.dataset.del); return; }
});
document.addEventListener("change", e => {
  if (e.target.id === "importFile" && e.target.files[0]) importBackup(e.target.files[0]);
  if (e.target.id === "logDate"){ logDate = e.target.value && e.target.value <= todayStr() ? e.target.value : todayStr(); render(); }
  if (e.target.id === "editDate" && editing){ editing.date = e.target.value || editing.date; }
});
document.addEventListener("input", e => {
  const el = e.target, i = Number(el.dataset && el.dataset.i);
  if (el.dataset && el.dataset.key){
    const arr = dArr(draft.values, el.dataset.key); arr[i] = arr[i] || {}; arr[i][el.dataset.f] = el.value;
    if (missing.delete(el.dataset.key + ":" + i)) el.closest(".setrow").querySelector(".field.miss")?.classList.remove("miss");
    saveDraft();
  } else if (el.dataset && el.dataset.ekey && editing){
    const arr = dArr(editing.values, el.dataset.ekey); arr[i] = arr[i] || {}; arr[i][el.dataset.f] = el.value;
    if (editing.missing.delete(el.dataset.ekey + ":" + i)) el.closest(".setrow").querySelector(".field.miss")?.classList.remove("miss");
  }
});
$("#saveBtn").addEventListener("click", saveSession);
$("#streak").addEventListener("click", streakToast);
$("#tab-today").addEventListener("click", () => { tab = "today"; render(); });
$("#tab-history").addEventListener("click", () => { tab = "history"; render(); });
$("#tab-study").addEventListener("click", () => { tab = "study"; render(); window.scrollTo({ top: 0 }); });

sortSessions(); syncNext(); cacheState();
if (!Number.isInteger(draft.dayIdx)) selIdx = state.nextIdx;
render();

try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
